{# templates/navbar.html #}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">

    <a class="navbar-brand" href="{% url 'dashboard' %}">
      <i class="fas fa-shipping-fast me-2"></i>Encomiendas
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarMain" aria-controls="navbarMain"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    {% if user.is_authenticated %}
    <div class="collapse navbar-collapse" id="navbarMain">

      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">
            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
            {% if nav_activas > 0 %}
              <span class="badge bg-secondary rounded-pill">{{ nav_activas }}</span>
            {% endif %}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'encomienda_lista' %}">
            <i class="fas fa-boxes me-1"></i>Encomiendas
            {% if nav_retraso > 0 %}
              <span class="badge bg-danger rounded-pill">{{ nav_retraso }}</span>
            {% endif %}
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'encomienda_crear' %}">
            <i class="fas fa-plus me-1"></i>Nueva
          </a>
        </li>

      </ul>

      <div class="d-flex align-items-center gap-3">
        <a href="{% url 'perfil' %}" class="navbar-text text-white text-decoration-none">
          <i class="fas fa-user me-1"></i>{{ user.username }}
        </a>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
          <i class="fas fa-sign-out-alt me-1"></i>Salir
        </a>
      </div>

    </div>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn-outline-light">
      <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión
    </a>
    {% endif %}

  </div>
</nav>
